<!-- Reading Progress Bar -->
<div id="reading-progress-container" class="fixed top-0 left-0 w-full h-1 z-[200] bg-transparent hidden">
    <div id="reading-progress-bar" class="h-full bg-gradient-to-r from-gold-500 to-yellow-300 w-0 transition-all duration-150 ease-out"></div>
</div>

<!-- Floating Reading Tools (A+ / A-) -->
<div id="reading-tools" class="fixed right-4 bottom-24 z-[90] flex flex-col gap-2 transition-opacity duration-300 opacity-0 pointer-events-none">
    <button onclick="changeFontSize(1)" class="w-10 h-10 rounded-full glass-nav flex items-center justify-center text-gold-500 hover:bg-gold-500 hover:text-white transition-colors shadow-lg border border-gold-500/20" aria-label="تكبير الخط">
        <i data-lucide="a-large-small" class="w-5 h-5"></i>
        <span class="absolute -top-2 -right-2 text-xs font-bold bg-gold-500 text-white rounded-full w-4 h-4 flex items-center justify-center">+</span>
    </button>
    <button onclick="changeFontSize(-1)" class="w-10 h-10 rounded-full glass-nav flex items-center justify-center text-gold-500 hover:bg-gold-500 hover:text-white transition-colors shadow-lg border border-gold-500/20" aria-label="تصغير الخط">
        <i data-lucide="a-large-small" class="w-4 h-4"></i>
        <span class="absolute -top-2 -right-2 text-xs font-bold bg-gold-500 text-white rounded-full w-4 h-4 flex items-center justify-center">-</span>
    </button>
    <!-- Native Share Button -->
    <button onclick="nativeShare()" class="w-10 h-10 rounded-full glass-nav flex items-center justify-center text-teal-500 hover:bg-teal-500 hover:text-white transition-colors shadow-lg border border-teal-500/20 mt-2" aria-label="مشاركة">
        <i data-lucide="share-2" class="w-5 h-5"></i>
    </button>
</div>

<script>
    // Reveal tools only on single poetry pages when scrolling
    document.addEventListener('DOMContentLoaded', () => {
        const article = document.querySelector('article.prose');
        const tools = document.getElementById('reading-tools');
        const progressContainer = document.getElementById('reading-progress-container');
        const progressBar = document.getElementById('reading-progress-bar');
        
        if (article) {
            progressContainer.classList.remove('hidden');
            
            window.addEventListener('scroll', () => {
                // Reading progress logic
                const windowHeight = window.innerHeight;
                const documentHeight = document.body.clientHeight;
                const scrollTop = window.scrollY;
                
                // Calculate percentage based on article position
                const articleRect = article.getBoundingClientRect();
                const articleTop = scrollTop + articleRect.top;
                const articleHeight = articleRect.height;
                
                let percentage = 0;
                if (scrollTop > articleTop - windowHeight / 2) {
                    percentage = ((scrollTop - (articleTop - windowHeight / 2)) / articleHeight) * 100;
                }
                
                percentage = Math.min(100, Math.max(0, percentage));
                progressBar.style.width = percentage + '%';
                
                // Show/hide tools
                if (scrollTop > 300) {
                    tools.classList.remove('opacity-0', 'pointer-events-none');
                } else {
                    tools.classList.add('opacity-0', 'pointer-events-none');
                }
            });
        }
    });

    let currentZoom = 1;
    function changeFontSize(step) {
        const article = document.querySelector('article.prose');
        if (!article) return;
        
        currentZoom += (step * 0.1);
        currentZoom = Math.min(1.5, Math.max(0.8, currentZoom)); // Min 80%, Max 150%
        
        article.style.transform = `scale(${currentZoom})`;
        article.style.transformOrigin = 'top center';
        article.style.transition = 'transform 0.3s ease';
    }

    async function nativeShare() {
        const shareData = {
            title: document.title,
            text: 'اقرأ هذه القصيدة الرائعة لبلتاجي الرمحي',
            url: window.location.href
        };
        
        try {
            if (navigator.share) {
                await navigator.share(shareData);
            } else {
                // Fallback for unsupported browsers (copy link)
                navigator.clipboard.writeText(window.location.href);
                alert('تم نسخ الرابط بنجاح!');
            }
        } catch (err) {
            console.log('Error sharing:', err);
        }
    }
</script>
