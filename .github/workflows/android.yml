name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Install Android SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.121.2'
          extended: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build offline Hugo site
        run: hugo --minify

      - name: Copy Hugo build to Android assets
        run: |
          rm -rf android/app/src/main/assets/*
          cp -r public/* android/app/src/main/assets/

      - name: Grant execute permission for gradlew
        run: chmod +x ./android/gradlew

      - name: Build with Gradle
        run: ./android/gradlew assembleDebug --project-dir ./android --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Beltagy-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
